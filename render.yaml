services:
  - type: web
    name: nfl-gridlock-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    healthCheckPath: /puzzle/today
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_PORT
        value: 10000
