services:
  - type: web
    name: nfl-gridlock-api
    runtime: node
    buildCommand: cd api && npm install
    startCommand: node api/index.js
    plan: free
    healthCheckPath: /puzzle/today
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_PORT
        value: 10000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false

  - type: cron
    name: pick6-data-refresh
    runtime: python
    schedule: "0 12 * * 2"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/load_data.py --current-season
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.3
