<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="no-referrer" />
    <!-- frame-ancestors only works as a header, so it's in vercel.json -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://accounts.google.com/gsi/client;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' http://localhost:3001 https://api.pick6.io https://*.onrender.com https://a.espncdn.com https://static.www.nfl.com https://*.googleusercontent.com data:;
      connect-src 'self' http://localhost:3001 https://api.pick6.io https://*.onrender.com https://*.amazonaws.com https://github.com https://objects.githubusercontent.com https://accounts.google.com;
      frame-src https://accounts.google.com;
    " />
    <title>Pick6.io: daily sports trivia games</title>
    <meta name="description" content="Daily sports trivia games, each scored out of 6. New puzzles every day. Pick6.io is an independent project, not affiliated with the NFL or any other league." />
    <link rel="canonical" href="https://pick6.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pick6.io/" />
    <meta property="og:title" content="Pick6.io: daily sports trivia games" />
    <meta property="og:description" content="Daily sports trivia games, each scored out of 6. New puzzles every day. Pick6.io is an independent project, not affiliated with the NFL or any other league." />
    <meta property="og:image" content="https://pick6.io/og-image.png?v=2" />

    <!-- big image previews in Discord and others -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pick6.io/og-image.png?v=2" />

    <!-- Google needs a PNG favicon (multiple of 48px), browsers use the SVG -->
    <link rel="icon" type="image/svg+xml" href="/pick-six-logo.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- self-hosted fonts, see src/index.css -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
