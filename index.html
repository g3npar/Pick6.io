<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="no-referrer" />
    <!--
      frame-ancestors is deliberately left out here, it's ignored when
      delivered via <meta> (browsers only honor it as a real HTTP header),
      so it's set in vercel.json's headers instead, where it actually works.
      This tag still covers local dev (vite dev doesn't apply vercel.json).
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://accounts.google.com/gsi/client;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' https://a.espncdn.com https://*.googleusercontent.com data:;
      connect-src 'self' http://localhost:3001 https://api.pick6.io https://*.onrender.com https://*.amazonaws.com https://github.com https://objects.githubusercontent.com https://accounts.google.com;
      frame-src https://accounts.google.com;
    " />
    <title>Pick6.io: spot the lie among six NFL facts</title>
    <meta name="description" content="A new NFL player puzzle every day. Six facts, one of them a lie, spot it and name the player to score." />
    <link rel="canonical" href="https://pick6.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pick6.io/" />
    <meta property="og:title" content="Pick6.io: spot the lie among six NFL facts" />
    <meta property="og:description" content="A new NFL player puzzle every day. Six facts, one of them a lie, spot it and name the player to score." />
    <meta property="og:image" content="https://pick6.io/og-image.png" />

    <!-- Not for Twitter/X itself, Discord and a few other unfurlers key off this
         tag specifically to render a large image embed instead of a small thumbnail. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pick6.io/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/pick-six-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Anton&display=swap"
      rel="stylesheet"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
